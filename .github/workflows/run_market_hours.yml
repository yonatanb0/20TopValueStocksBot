name: Refresh stock signal pool

on:
  schedule:
    # Every 20 minutes, 12:00-21:40 UTC, Mon-Fri only -- a window wide enough
    # to cover the full NYSE session across both US daylight-saving states
    # (cron can't shift for DST). 30 runs/day x 20 TwelveData credits = 600,
    # safely under the free plan's 800/day cap, and zero runs wasted overnight
    # or on weekends when prices can't move.
    - cron: "*/20 12-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal refresh
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
        run: python src/main.py

      - name: Build dashboard
        run: python src/build_dashboard.py

      - name: Commit and push updated data + dashboard
        run: |
          git config user.name "stock-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/ docs/)" ]; then
            git add data/ docs/
            git commit -m "Refresh signal pool $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No data changes to commit."
          fi
