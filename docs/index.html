<head>

<title>20TopValueStocksBot — Desk</title>
<style>
  /* Palette modeled on the Financial Times: signature salmon "paper" ground,
     black serif headlines, claret accent. Dark mode is FT's own dark theme
     (near-black ground, same claret, brightened for contrast) -- not an
     inverted salmon, which would just look muddy. */
  :root {
    --claret: #990F3D;
    --claret-soft: #990F3D16;
    --forest: #1C5C39;
    --forest-soft: #1C5C3916;
    --ochre: #9C6D0E;
    --ochre-soft: #9C6D0E16;
    --oxford: #48566B;
    --oxford-soft: #48566B16;
    --quiet: #8B8178;
    --quiet-soft: #8B817816;

    --bg: #FFF1E5;
    --card: #FFF1E5;
    --card-hover: #FFF8F1;
    --border: #C9BFB3;
    --rule: #1A1A1A;
    --ink: #1A1A1A;
    --ink-muted: #66605C;
    --ink-faint: #8C8579;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --claret: #E8567E; --claret-soft: #E8567E1F;
      --forest: #5FA97D; --forest-soft: #5FA97D1F;
      --ochre: #D9A233; --ochre-soft: #D9A2331F;
      --oxford: #8BA0B5; --oxford-soft: #8BA0B51F;
      --quiet: #948C82; --quiet-soft: #948C821F;
      --bg: #0D0C0C; --card: #0D0C0C; --card-hover: #181615;
      --border: #3A342E; --rule: #F2E9E4; --ink: #F2E9E4; --ink-muted: #B5ACA5; --ink-faint: #857D74;
    }
  }
  :root[data-theme="dark"] {
    --claret: #E8567E; --claret-soft: #E8567E1F;
    --forest: #5FA97D; --forest-soft: #5FA97D1F;
    --ochre: #D9A233; --ochre-soft: #D9A2331F;
    --oxford: #8BA0B5; --oxford-soft: #8BA0B51F;
    --quiet: #948C82; --quiet-soft: #948C821F;
    --bg: #0D0C0C; --card: #0D0C0C; --card-hover: #181615;
    --border: #3A342E; --rule: #F2E9E4; --ink: #F2E9E4; --ink-muted: #B5ACA5; --ink-faint: #857D74;
  }
  :root[data-theme="light"] {
    --claret: #990F3D; --claret-soft: #990F3D16;
    --forest: #1C5C39; --forest-soft: #1C5C3916;
    --ochre: #9C6D0E; --ochre-soft: #9C6D0E16;
    --oxford: #48566B; --oxford-soft: #48566B16;
    --quiet: #8B8178; --quiet-soft: #8B817816;
    --bg: #FFF1E5; --card: #FFF1E5; --card-hover: #FFF8F1;
    --border: #C9BFB3; --rule: #1A1A1A; --ink: #1A1A1A; --ink-muted: #66605C; --ink-faint: #8C8579;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    background: var(--bg);
    color: var(--ink);
    font-family: "FT Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 3rem;
  }
  .serif { font-family: "Financier Display", Georgia, "Times New Roman", Times, serif; }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }

  /* ---------- status bar ---------- */
  .statusbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem;
    padding: 0.65rem 1.25rem;
    background: var(--card);
    border-bottom: 3px solid var(--rule);
    backdrop-filter: blur(6px);
  }
  .statusbar-left { display: flex; align-items: center; gap: 0.6rem; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--forest);
    box-shadow: 0 0 0 0 var(--forest-soft);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--forest-soft); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .statusbar-title {
    font-family: "Financier Display", Georgia, "Times New Roman", Times, serif;
    font-weight: 700; font-size: 1.05rem; letter-spacing: 0.005em; cursor: pointer;
  }
  .statusbar-sub { color: var(--ink-muted); font-size: 0.8rem; }
  .statusbar-right { font-size: 0.78rem; color: var(--ink-muted); text-align: right; }

  /* ---------- ticker tape ---------- */
  .tape-outer {
    overflow: hidden;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .tape-track {
    display: flex;
    width: max-content;
    animation: scroll 48s linear infinite;
  }
  .tape-outer:hover .tape-track { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .tape-track { animation: none; }
    .tape-outer { overflow-x: auto; }
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .tape-item {
    display: flex; align-items: baseline; gap: 0.4rem;
    padding: 0.4rem 1.1rem;
    border-right: 1px solid var(--border);
    white-space: nowrap; font-size: 0.82rem;
    cursor: pointer;
  }
  .tape-ticker { font-weight: 700; }
  .tape-price { color: var(--ink-muted); }
  .tape-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ---------- stats row ---------- */
  .stats-row {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    padding: 1rem 1.25rem 0.25rem;
  }
  .stat-chip {
    display: flex; align-items: center; gap: 0.45rem;
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--rule);
    border-radius: 0;
    background: var(--card);
    font-size: 0.78rem;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .stat-chip:hover, .stat-chip:focus-visible { border-color: var(--ink-faint); }
  .stat-chip.active { background: var(--card-hover); border-color: currentColor; }
  .stat-chip .swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .stat-chip .count { font-weight: 700; }
  .stat-chip .label { color: var(--ink-muted); }

  .lean-legend { padding: 0.35rem 1.25rem 0; font-size: 0.72rem; color: var(--ink-faint); display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }
  .lean-legend-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 0; margin: 0 0.15rem; vertical-align: middle; }
  .lean-legend-surge { background: var(--forest-soft); border: 1px solid var(--forest); }
  .lean-legend-fall { background: var(--claret-soft); border: 1px solid var(--claret); }

  /* ---------- basket widget (home page) ---------- */
  .basket-panel {
    margin: 1rem 1.25rem 0;
    border: 1px solid var(--border);
    border-top: 2px solid var(--rule);
    background: var(--card);
    padding: 0.95rem 1.1rem;
  }
  .basket-asof { font-size: 0.65rem; color: var(--ink-faint); text-transform: none; letter-spacing: 0; margin-left: 0.5rem; font-weight: 400; }

  /* ---------- grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.9rem;
    padding: 1rem 1.25rem 0;
  }
  .card {
    border: 1px solid var(--border);
    border-top: 2px solid var(--rule);
    background: var(--card);
    border-radius: 0;
    padding: 0.95rem 1.05rem;
    display: flex; flex-direction: column; gap: 0.55rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    text-decoration: none;
  }
  .card:hover, .card:focus-visible { background: var(--card-hover); border-color: var(--ink-faint); }
  .card[hidden] { display: none; }

  /* Whole-card tint for directional lean -- distinct from the status badge:
     the badge says what your STRATEGY calls actionable; this says what the
     INDICATORS lean toward, which can differ (e.g. a two-pole turn alone is
     "watching" by strategy rules, but still worth coloring as a bullish lean). */
  .card.lean-surge { background: var(--forest-soft); border-color: var(--forest); }
  .card.lean-surge:hover, .card.lean-surge:focus-visible { background: var(--forest-soft); border-color: var(--forest); filter: brightness(1.08); }
  .card.lean-fall { background: var(--claret-soft); border-color: var(--claret); }
  .card.lean-fall:hover, .card.lean-fall:focus-visible { background: var(--claret-soft); border-color: var(--claret); filter: brightness(1.08); }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
  .card-id { display: flex; flex-direction: column; gap: 0.15rem; }
  .card-ticker { font-family: "Financier Display", Georgia, "Times New Roman", Times, serif; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.01em; }
  .card-name { font-size: 0.74rem; color: var(--ink-muted); }
  .card-sector { font-size: 0.68rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.1rem; }

  .badge {
    font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.22rem 0.5rem 0.18rem; border-radius: 0; white-space: nowrap;
    border-bottom: 2px solid currentColor;
  }
  .badge-entry    { color: var(--forest); background: var(--forest-soft); }
  .badge-onsale   { color: var(--ochre); background: var(--ochre-soft); }
  .badge-exit     { color: var(--claret);   background: var(--claret-soft); }
  .badge-watching { color: var(--oxford); background: var(--oxford-soft); }
  .badge-quiet    { color: var(--quiet); background: var(--quiet-soft); }

  .card-price { font-size: 1.05rem; font-weight: 600; }
  .card-price .unit { font-size: 0.7rem; color: var(--ink-faint); font-weight: 400; margin-left: 0.3rem; }
  .card-price.none { color: var(--ink-faint); font-weight: 400; font-size: 0.85rem; font-style: italic; }

  .card-pitch { font-size: 0.82rem; line-height: 1.4; color: var(--ink-muted); margin: 0; }

  .card-thesis-tag {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.68rem; color: var(--claret); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .card-thesis-tag::before { content: "◆"; font-size: 0.6rem; }

  .card-position-tag {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.68rem; font-weight: 700;
    padding: 0.15rem 0.4rem; border-radius: 0; width: fit-content;
  }
  .card-position-tag.pos { color: var(--forest); background: var(--forest-soft); }
  .card-position-tag.neg { color: var(--claret); background: var(--claret-soft); }
  .pnl.pos { color: var(--forest); }
  .pnl.neg { color: var(--claret); }

  .card-goto { font-size: 0.7rem; color: var(--ink-faint); margin-top: 0.15rem; }

  footer {
    padding: 1.5rem 1.25rem 0.5rem;
    font-size: 0.72rem;
    color: var(--ink-faint);
    text-align: center;
  }

  /* ---------- detail page ---------- */
  .detail { padding: 0 1.25rem; max-width: 760px; margin: 0 auto; }
  .back-link {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.8rem; color: var(--ink-muted); text-decoration: none;
    padding: 1rem 0 0.5rem; cursor: pointer;
  }
  .back-link:hover { color: var(--ink); }

  .detail-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; padding: 0.5rem 0 1rem; border-bottom: 1px solid var(--border);
  }
  .detail-ticker { font-family: "Financier Display", Georgia, "Times New Roman", Times, serif; font-size: 2.1rem; font-weight: 700; }
  .detail-name { font-size: 0.9rem; color: var(--ink-muted); }
  .detail-sector { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.2rem; }
  .detail-price-block { text-align: right; }
  .detail-price { font-size: 1.6rem; font-weight: 600; }
  .detail-price .unit { display: block; font-size: 0.68rem; color: var(--ink-faint); font-weight: 400; }

  .section { padding: 1.25rem 0; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-title {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-faint); margin: 0 0 0.75rem;
  }

  .verdict-panel {
    border: 1px solid var(--border);
    border-left: 4px solid var(--claret);
    background: var(--card);
    padding: 0.9rem 1.1rem;
    border-radius: 0;
  }
  .verdict-panel p { margin: 0; font-size: 0.94rem; line-height: 1.55; }
  .verdict-call {
    display: inline-block; font-weight: 700; color: var(--claret);
    margin-bottom: 0.4rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em;
  }

  .headline-item { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  .headline-item:last-child { border-bottom: none; }
  .headline-title { font-size: 0.88rem; font-weight: 600; line-height: 1.4; }
  .headline-title a { text-decoration: none; }
  .headline-title a:hover { text-decoration: underline; }
  .headline-meta { font-size: 0.72rem; color: var(--ink-faint); margin-top: 0.25rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .headline-tag {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700;
    padding: 0.1rem 0.4rem; border-radius: 0;
  }
  .headline-tag.positive { color: var(--forest); background: var(--forest-soft); }
  .headline-tag.negative { color: var(--claret); background: var(--claret-soft); }
  .headline-tag.neutral { color: var(--oxford); background: var(--oxford-soft); }
  .empty-note { font-size: 0.84rem; color: var(--ink-faint); font-style: italic; }

  .sig-row { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.85rem; padding: 0.45rem 0; }
  .sig-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 0.4rem; }
  .sig-dot.on  { background: var(--forest); }
  .sig-dot.off { background: var(--ink-faint); }
  .sig-type { font-weight: 600; }
  .sig-note { color: var(--ink-muted); }

  .levels-row { display: flex; flex-wrap: wrap; gap: 1.2rem; }
  .level { display: flex; flex-direction: column; gap: 0.15rem; }
  .level .k { color: var(--ink-faint); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .level .v { font-weight: 700; font-size: 1rem; }

  .next-review { font-size: 0.82rem; color: var(--ink-muted); }
  .next-review b { color: var(--ink); }
</style>
</head>

  const STATUS_META = {

  function fmtN(v, digits, suffix) {
    return v == null ? '—' : v.toFixed(digits) + (suffix || '');
  }

  function fmtSigned(v, digits, suffix) {
    return v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(digits) + (suffix || '');
  }

  function fmtPrice(p) {
    return p == null
      ? '<span class="card-price none">no live quote logged</span>'
      : '<span class="card-price mono">$' + p.toFixed(2) + '<span class="unit">spot</span></span>';
  }

  function renderTape() {
    const items = STOCKS.map(s => {
      const meta = STATUS_META[s.status];
      const price = s.price != null ? '$' + s.price.toFixed(2) : '—';
      return '<div class="tape-item" data-ticker="' + s.ticker + '"><span class="tape-dot" style="background:' + meta.color + '"></span>' +
             '<span class="tape-ticker">' + s.ticker + '</span>' +
             '<span class="tape-price mono">' + price + '</span></div>';
    }).join('');
    document.getElementById('tape').innerHTML = items + items; // duplicate for seamless loop
  }

    const meta = STATUS_META[s.status];

    const headlinesHtml = s.headlines.length
      ? s.headlines.map(h => (
          '<div class="headline-item">' +
            '<div class="headline-title">' + (h.url ? '<a href="' + h.url + '" target="_blank" rel="noopener">' + h.title + '</a>' : h.title) + '</div>' +
            '<div class="headline-meta">' +
              '<span>' + (h.date || '') + '</span>' +
              '<span class="headline-tag ' + h.tag + '">' + h.tagLabel + '</span>' +
              (h.note ? '<span>' + h.note + '</span>' : '') +
            '</div>' +
          '</div>'
        )).join('')
      : '<p class="empty-note">No news headlines flagged for ' + s.ticker + ' this cycle.</p>';

    const signalsHtml = s.signals.length
      ? s.signals.map(sig =>
          '<div class="sig-row"><span class="sig-dot ' + (sig.on ? 'on' : 'off') + '"></span>' +
          '<span><span class="sig-type">' + sig.type + ':</span> <span class="sig-note">' + sig.note + '</span></span></div>'
        ).join('')
      : '<p class="empty-note">Nothing fired this cycle.</p>';

    const positionHtml = s.position ? (
      '<div class="section"><h2 class="section-title">Your Position (IBKR, read-only)</h2>' +
      '<div class="levels-row">' +
        '<div class="level"><span class="k">Shares</span><span class="v mono">' + fmtN(s.position.shares, 2) + '</span></div>' +
        '<div class="level"><span class="k">Avg Cost</span><span class="v mono">$' + fmtN(s.position.avgCost, 2) + '</span></div>' +
        '<div class="level"><span class="k">Market Value</span><span class="v mono">$' + fmtN(s.position.marketValue, 2) + '</span></div>' +
        '<div class="level"><span class="k">Unrealized P&amp;L</span><span class="v mono pnl ' + (s.position.unrealizedPnl >= 0 ? 'pos' : 'neg') + '">' +
          fmtSigned(s.position.unrealizedPnl, 2, '') +
          (s.position.unrealizedPnlPct != null ? ' (' + fmtSigned(s.position.unrealizedPnlPct, 1, '%') + ')' : '') +
        '</span></div>' +
      '</div></div>'
    ) : '';

    const sv = s.stateVector;
    const stateVectorHtml = sv ? (
      '<div class="section"><h2 class="section-title">State Vector (live technicals &amp; fundamentals)</h2>' +
      '<div class="levels-row">' +
        (sv.stopPrice != null ? '<div class="level"><span class="k">Stop</span><span class="v mono">$' + fmtN(sv.stopPrice, 2) + ' (' + fmtSigned(sv.pctFromStop, 1, '%') + ')</span></div>' : '') +
        (sv.targetPrice != null ? '<div class="level"><span class="k">Target</span><span class="v mono">$' + fmtN(sv.targetPrice, 2) + ' (' + fmtSigned(sv.pctFromTarget, 1, '%') + ')</span></div>' : '') +
        (sv.atrUnitsFromStop != null ? '<div class="level"><span class="k">ATR Units From Stop</span><span class="v mono">' + fmtN(sv.atrUnitsFromStop, 2) + '</span></div>' : '') +
        '<div class="level"><span class="k">Trend (20d/50d/200d)</span><span class="v">' +
          [sv.priceVsSma20, sv.priceVsSma50, sv.priceVsSma200].map(p => p || '—').join(' / ') +
        '</span></div>' +
        '<div class="level"><span class="k">ATR(14)</span><span class="v mono">' + (sv.atr14 != null ? '$' + fmtN(sv.atr14, 2) : '—') + '</span></div>' +
        '<div class="level"><span class="k">Realized Vol (20d, ann.)</span><span class="v mono">' + fmtN(sv.realizedVol20d, 1, '%') + '</span></div>' +
        '<div class="level"><span class="k">Forward P/E</span><span class="v mono">' + fmtN(sv.forwardPe, 1) + '</span></div>' +
        '<div class="level"><span class="k">EV/EBITDA (TTM)</span><span class="v mono">' + fmtN(sv.evEbitdaTtm, 1) + '</span></div>' +
        '<div class="level"><span class="k">Estimate Revisions</span><span class="v">' +
          (sv.revisionDirection || '—') + (sv.revisionPct != null ? ' (' + fmtSigned(sv.revisionPct, 1, '%') + ')' : '') +
        '</span></div>' +
        (sv.daysToNextEarnings != null ? '<div class="level"><span class="k">Next Earnings</span><span class="v">' + sv.daysToNextEarnings + ' days</span></div>' : '') +
      '</div></div>'
    ) : '';

    const levelsHtml = (s.levels && s.levels.length) ? (
      '<div class="section"><h2 class="section-title">Entry / Exit Levels</h2>' +
      '<div class="levels-row">' + s.levels.map(l =>
        '<div class="level"><span class="k">' + l.k + '</span><span class="v mono">' + l.v + '</span></div>'
      ).join('') + '</div>' +
      (s.review ? '<div class="next-review" style="margin-top:0.9rem;">Next review: <b>' + s.review + '</b></div>' : '') +
      '</div>'
    ) : '';

    container.innerHTML =
      '<a class="back-link" id="back-link">← Back to desk</a>' +
      '<div class="detail-head">' +
        '<div>' +
          '<div class="detail-ticker">' + s.ticker + '</div>' +
          '<div class="detail-name">' + s.name + '</div>' +
          '<div class="detail-sector">' + s.sector + '</div>' +
        '</div>' +
        '<div class="detail-price-block">' +
          (s.price != null
            ? '<div class="detail-price mono">$' + s.price.toFixed(2) + '</div><span class="unit">spot</span>'
            : '<div class="detail-price mono" style="font-size:0.95rem;color:var(--ink-faint);font-style:italic;">no live quote</div>') +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<h2 class="section-title">Why ' + (s.status === 'exit' ? 'sell / exit' : 'buy / hold') + '</h2>' +
        '<div class="verdict-panel">' +
          '<span class="verdict-call" style="color:' + meta.color + '">' + s.verdict + '</span>' +
          '<p>' + s.verdictParagraph + '</p>' +
        '</div>' +
      '</div>' +

      positionHtml +
      stateVectorHtml +

      '<div class="section">' +
        '<h2 class="section-title">Latest headlines</h2>' +
        headlinesHtml +
      '</div>' +

      '<div class="section">' +
        '<h2 class="section-title">Signal log</h2>' +
        signalsHtml +
      '</div>' +

      levelsHtml;

    document.getElementById('back-link').addEventListener('click', () => { location.hash = ''; });
  }

  function route() {
    const hash = location.hash;
    const match = hash.match(/^#\/(.+)$/);
    const gridView = document.getElementById('view-grid');
    const detailView = document.getElementById('view-detail');
    if (match) {
      gridView.hidden = true;
      detailView.hidden = false;
      renderDetail(match[1]);
      window.scrollTo(0, 0);
    } else {
      gridView.hidden = false;
      detailView.hidden = true;
    }
  }

  document.getElementById('home-link').addEventListener('click', () => { location.hash = ''; });
  document.getElementById('tape').addEventListener('click', e => {
    const item = e.target.closest('.tape-item');
    if (item) location.hash = '/' + item.dataset.ticker;
  });

  // The real cron is "*/20 12-21 * * 1-5" UTC -- every 20 minutes, 12:00-21:40 UTC,
  // Monday-Friday only (a window wide enough to cover the NYSE session across
  // both US daylight-saving states, since cron can't shift for DST). No runs
  // outside that window, so "next/last run" has to walk the actual schedule
  // rather than just rounding to a fixed interval.
  function isSchedWeekday(d) {
    const day = d.getUTCDay(); // 0=Sun ... 6=Sat
    return day >= 1 && day <= 5;
  }

  function atUTC(d, hour, minute) {
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), hour, minute, 0, 0));
  }

  function nextRunAtOrAfter(from) {
    const twentyMin = 20 * 60 * 1000;
    let d = new Date(Math.ceil(from.getTime() / twentyMin) * twentyMin);
    for (let i = 0; i < 20; i++) {
      const hour = d.getUTCHours();
      if (isSchedWeekday(d) && hour >= 12 && hour <= 21) return d;
      d = (hour > 21 || !isSchedWeekday(d))
        ? atUTC(new Date(d.getTime() + 24 * 60 * 60 * 1000), 12, 0)
        : atUTC(d, 12, 0);
    }
    return d;
  }

  function prevRunAtOrBefore(from) {
    const twentyMin = 20 * 60 * 1000;
    let d = new Date(Math.floor(from.getTime() / twentyMin) * twentyMin);
    for (let i = 0; i < 20; i++) {
      const hour = d.getUTCHours();
      if (isSchedWeekday(d) && hour >= 12 && hour <= 21) return d;
      d = (hour < 12 || !isSchedWeekday(d))
        ? atUTC(new Date(d.getTime() - 24 * 60 * 60 * 1000), 21, 40)
        : atUTC(d, 21, 40);
    }
    return d;
  }

  function renderRunTimes() {
    const now = new Date();
    const nextRunUTC = nextRunAtOrAfter(now);
    const lastRunUTC = prevRunAtOrBefore(now);

    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Jerusalem',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    document.getElementById('run-times').innerHTML =
      'last run ' + fmt.format(lastRunUTC) + ' Jerusalem' +
      ' &nbsp;&middot;&nbsp; next run ~' + fmt.format(nextRunUTC) + ' Jerusalem';
  }

  renderTape();
  renderBasketWidget();
  renderStats();
  renderGrid();
  renderRunTimes();
  wireFilters();
  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
